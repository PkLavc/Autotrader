name: AudaceFi API connection (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audacefi-connection.yml"

permissions:
  contents: read

concurrency:
  group: audacefi-connection
  cancel-in-progress: true

jobs:
  authenticated-read:
    name: Authenticate Crypto Bro account (no orders)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET consolidated account state
        env:
          AUDACEFI_API_KEY: ${{ secrets.AUDACEFI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import sys

          key = os.environ.get("AUDACEFI_API_KEY", "")
          if not key:
              print("MISSING_SECRET: save AUDACEFI_API_KEY in repository Actions secrets.")
              sys.exit(1)

          # Exact read-only endpoint shown in the account's AudaceFi control panel.
          # No redirects, no retries, no transaction submissions, and no secrets in logs.
          connection = http.client.HTTPSConnection("sandbox.audacefi.app", timeout=12)
          try:
              connection.request(
                  "GET",
                  "/api/v1/me/state?category=crypto-bro",
                  headers={
                      "Authorization": "Bearer " + key,
                      "Accept": "application/json",
                  },
              )
              response = connection.getresponse()
              status = response.status
              data = response.read(262145)
              if status != 200:
                  print(f"AUTH_CHECK_FAILED: HTTP {status}. Inspect AudaceFi Control Panel.")
                  sys.exit(1)
              if len(data) > 262144:
                  print("AUTH_CHECK_FAILED: response too large.")
                  sys.exit(1)
              parsed = json.loads(data)
              if not isinstance(parsed, dict):
                  print("AUTH_CHECK_FAILED: unexpected JSON response.")
                  sys.exit(1)
              print("AUTHENTICATED: read-only AudaceFi API request returned HTTP 200.")
              print("CATEGORY: crypto-bro")
              print("TRADING: disabled by this workflow.")
          except (OSError, ValueError, http.client.HTTPException) as exc:
              print(f"AUTH_CHECK_FAILED: {type(exc).__name__}.")
              sys.exit(1)
          finally:
              connection.close()
          PY
