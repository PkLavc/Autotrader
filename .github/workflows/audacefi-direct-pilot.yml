name: AudaceFi direct Devnet trading

on:
  schedule:
    - cron: '17,47 * 9-13 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Direct Devnet trading mode'
        required: true
        type: choice
        options: [preflight, execute, reconcile, verify10, finalize10, history, sell, auto]
        default: preflight
      session_minutes:
        description: 'Auto mode session: 0 for one check, 330 for continuous checks'
        required: false
        type: choice
        options: ['0', '330']
        default: '0'

permissions:
  contents: write

concurrency:
  group: audacefi-direct-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Build pinned official bench verifier
        run: |
          git clone --quiet https://github.com/AudaceFi/audacefi-integration-kit.git vendor/audacefi-integration-kit
          git -C vendor/audacefi-integration-kit checkout --detach 9abd82702795929722554906b3ac14a7c861181a
          test "$(git -C vendor/audacefi-integration-kit rev-parse HEAD)" = 9abd82702795929722554906b3ac14a7c861181a
          cd vendor/audacefi-integration-kit
          npm ci --ignore-scripts
          npm run build
      - name: Instrument strict verifier for safe reconciliation diagnostics
        if: github.event_name == 'schedule' || inputs.mode == 'reconcile' || inputs.mode == 'verify10' || inputs.mode == 'finalize10' || inputs.mode == 'sell' || inputs.mode == 'auto'
        run: node integrations/audacefi/verifier-diagnostics.mjs "${{ inputs.mode || 'auto' }}"
      - uses: actions/setup-python@v7
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install crypto signal dependencies
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        run: pip install -r requirements.txt
      - name: Reconcile and operate the Devnet season
        env:
          AUDACEFI_API_KEY: ${{ secrets.AUDACEFI_API_KEY }}
          AUDACEFI_WALLET_ADDRESS: ${{ secrets.AUDACEFI_WALLET_ADDRESS }}
          AUDACEFI_WALLET_RECOVERY_PHRASE: ${{ secrets.AUDACEFI_WALLET_RECOVERY_PHRASE }}
          AUDACEFI_JOURNAL_KEY: ${{ secrets.AUDACEFI_JOURNAL_KEY }}
          AUDACEFI_ENABLE_EXECUTION: ${{ (github.event_name == 'schedule' || inputs.mode == 'execute' || inputs.mode == 'sell' || inputs.mode == 'auto') && 'true' || 'false' }}
          AUDACEFI_DEVNET_ACK: ${{ (github.event_name == 'schedule' || inputs.mode == 'execute' || inputs.mode == 'sell' || inputs.mode == 'auto') && 'true' || 'false' }}
          AUDACEFI_ALLOW_ENTRY: 'false'
          GITHUB_TOKEN: ${{ github.token }}
          AUDACEFI_SESSION_MINUTES: ${{ github.event_name == 'schedule' && '330' || inputs.session_minutes || '0' }}
        run: |
          mode="${{ inputs.mode || 'auto' }}"
          if [ "$mode" != auto ]; then
            node integrations/audacefi/direct-pilot.mjs "$mode"
            exit $?
          fi
          case "$AUDACEFI_SESSION_MINUTES" in 0|330) ;; *) exit 2 ;; esac
          end=$((SECONDS + AUDACEFI_SESSION_MINUTES * 60))
          failures=0
          while :; do
            if node integrations/audacefi/direct-pilot.mjs auto; then
              failures=0
            else
              failures=$((failures + 1))
              echo "AUDACEFI_SESSION_CONSECUTIVE_FAILURES=$failures"
              if [ "$failures" -ge 3 ]; then exit 1; fi
            fi
            if [ "$AUDACEFI_SESSION_MINUTES" = 0 ] || [ "$SECONDS" -ge "$end" ]; then break; fi
            sleep 180
          done
