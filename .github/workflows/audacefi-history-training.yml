name: AudaceFi historical training (research only)

on:
  workflow_dispatch:
  schedule:
    # Archive walk-forward is expensive; live matured outcomes update every
    # executor cycle, while the twelve-month historical gate refreshes weekly.
    - cron: '32 7 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audacefi-history-training.yml'
      - 'integrations/audacefi/history_job.py'
      - 'integrations/audacefi/history_research.py'
      - 'integrations/audacefi/adaptive_learning.py'
      - 'integrations/audacefi/strategy_qualification.py'
      - 'integrations/audacefi/adaptive_feedback.py'
      - 'deploy/oracle/audacefi-research.service'
      - 'deploy/oracle/audacefi-research-run.sh'
      - 'deploy/oracle/audacefi-research.timer'
      - 'deploy/oracle/audacefi-kronos-shadow.service'
      - 'deploy/oracle/audacefi-kronos-shadow.timer'
      - 'integrations/audacefi/oracle_publish.py'
      - 'tests/test_audacefi_history_research.py'
      - 'tests/test_audacefi_oracle_services.py'

permissions:
  contents: write

concurrency:
  group: audacefi-history-research
  cancel-in-progress: true

jobs:
  historical-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify archive parser, walk-forward and reused AutoTrader calibration
        run: pytest -q tests/test_audacefi_history_research.py
      - name: Analyze twelve months of verified spot history for eligible tokens
        env:
          AUDACEFI_API_KEY: ${{ secrets.AUDACEFI_API_KEY }}
        run: python -m integrations.audacefi.history_job
      - name: Update the live strategy gate only from the untouched holdout result
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m integrations.audacefi.strategy_qualification
            git add integrations/audacefi/strategy-qualification.json integrations/audacefi/strategy-qualification.json.sha256
            if git diff --cached --quiet; then
              echo 'AUDACEFI_QUALIFICATION_UNCHANGED=true'
              break
            fi
            git commit -m "chore(audacefi): update historical strategy qualification"
            if git push origin HEAD:main; then
              echo 'AUDACEFI_QUALIFICATION_PUBLISHED=true'
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "AUDACEFI_QUALIFICATION_PUSH_RETRY=$attempt"
            sleep 2
          done
      - name: Upload nonsecret research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audacefi-historical-research
          path: audacefi-historical-qualification.json
          if-no-files-found: ignore
          retention-days: 7
