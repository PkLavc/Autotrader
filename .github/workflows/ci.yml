name: Autotrader CI

on:
  push:
    branches: [main]
    paths:
      - "autotrader/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "autotrader/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
