name: Autotrader CI

on:
  push:
    branches: [main]
    paths:
      - "autotrader/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - "fleet-worker/**"
      - "account/**"
      - "assets/account.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "autotrader/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - "fleet-worker/**"
      - "account/**"
      - "assets/account.*"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  fleet-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fleet-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node --check ../assets/account.js
