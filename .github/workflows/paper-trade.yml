name: Autotrader paper portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "RUN_NOW"

concurrency:
  group: autotrader-paper-portfolio
  cancel-in-progress: false

jobs:
  simulate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-base-${{ hashFiles('MODEL_REF', 'TOKENIZER_REF') }}
          restore-keys: |
            hf-kronos-base-

      - name: Fetch pinned Kronos source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < UPSTREAM_REF)"
          mkdir -p vendor/Kronos
          git -C vendor/Kronos init
          git -C vendor/Kronos remote add origin https://github.com/shiyu-coder/Kronos.git
          git -C vendor/Kronos fetch --depth 1 origin "$REF"
          git -C vendor/Kronos checkout --detach FETCH_HEAD

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vendor/Kronos/requirements.txt
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Run paper portfolio
        run: python -m autotrader.run --state data/state.json --report data/latest.json

      - name: Upload generated state
        uses: actions/upload-artifact@v4
        with:
          name: autotrader-state
          path: |
            data/state.json
            data/latest.json
          retention-days: 3
          if-no-files-found: error

  persist:
    needs: simulate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated state
        uses: actions/download-artifact@v4
        with:
          name: autotrader-state
          path: generated

      - name: Persist paper-trading history
        shell: bash
        run: |
          set -euo pipefail
          cp generated/data/state.json data/state.json
          cp generated/data/latest.json data/latest.json
          git config user.name "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/latest.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "chore: update Autotrader paper portfolio"
            git push
          fi
